apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: traific-api-hpa
  namespace: traific-apps
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: traific-api
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
