apiVersion: apps/v1
kind: Deployment
metadata:
  name: traific-api
  namespace: traific-apps
  labels:
    app: traific-api
    app.kubernetes.io/name: traific-api
    app.kubernetes.io/version: "1.0"
spec:
  replicas: 2
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: traific-api
      app.kubernetes.io/name: traific-api
  template:
    metadata:
      labels:
        app: traific-api
        app.kubernetes.io/name: traific-api
        app.kubernetes.io/version: "1.0"
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: traific-api
      containers:
        - name: traific-api
          image: traific/api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secret
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: db-password
            - name: AWS_STS_REGIONAL_ENDPOINTS
              value: regional
            - name: AWS_DEFAULT_REGION
              value: ap-southeast-2
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: traific-api
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: traific-api
  namespace: traific-apps
  labels:
    app: traific-api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8000
  selector:
    app: traific-api
    app.kubernetes.io/name: traific-api
---
apiVersion: v1
kind: Secret
metadata:
  name: api-secret
  namespace: traific-apps
type: Opaque
stringData:
  db-password: "CHANGE_ME_IN_PRODUCTION"
  api-key-hash: "CHANGE_ME_SHA256"
