# Cloud-agnostic ingress using nginx-ingress
# Use cloud-specific overlays (AWS/GCP/Azure) for production
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: traific-ingress
  namespace: traific-apps
  labels:
    app: traific
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: ${API_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: traific-api
                port:
                  number: 80
  tls:
    - hosts:
        - ${API_HOST}
      secretName: traific-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: emqx-dashboard-ingress
  namespace: traific-mqtt
  labels:
    app: emqx
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  ingressClassName: nginx
  rules:
    - host: ${MQTT_ADMIN_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: emqx
                port:
                  number: 18083
  tls:
    - hosts:
        - ${MQTT_ADMIN_HOST}
      secretName: emqx-tls
