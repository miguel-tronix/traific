apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: traific-redis
  labels:
    app: redis
    app.kubernetes.io/name: redis
    app.kubernetes.io/version: "7.2"
spec:
  serviceName: redis-headless
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: redis
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app: redis
        app.kubernetes.io/name: redis
        app.kubernetes.io/version: "7.2"
    spec:
      nodeSelector:
        workload: redis
      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "redis"
          effect: "NoSchedule"
      containers:
        - name: redis
          image: redis:7.2-alpine
          imagePullPolicy: IfNotPresent
          command:
            - redis-server
            - /usr/local/etc/redis/redis.conf
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
            - name: redis-sentinel
              containerPort: 26379
              protocol: TCP
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: redis-password
                  optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - name: redis-data
              mountPath: /data
            - name: redis-config
              mountPath: /usr/local/etc/redis/redis.conf
              subPath: redis.conf
      volumes:
        - name: redis-config
          configMap:
            name: redis-config
        - name: redis-data
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: redis-data
        namespace: traific-redis
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: traific-redis
type: Opaque
stringData:
  redis-password: "CHANGE_ME_IN_PRODUCTION"
