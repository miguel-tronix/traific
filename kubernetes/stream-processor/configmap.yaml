apiVersion: v1
kind: ConfigMap
metadata:
  name: stream-processor-config
  namespace: traific-apps
data:
  MQTT_BROKER_URL: "tcp://emqx.traific-mqtt:1883"
  MQTT_TOPIC: "sensors/+/data"
  MQTT_CLIENT_ID: "stream-processor"
  MQTT_QOS: "1"
  DB_HOST: "traific-postgres.cluster-*.ap-southeast-2.rds.amazonaws.com"
  DB_PORT: "5432"
  DB_NAME: "traific_db"
  DB_POOL_SIZE: "20"
  DB_MAX_OVERFLOW: "10"
  BATCH_SIZE: "500"
  FLUSH_INTERVAL_SEC: "5"
  S3_BUCKET: "TRAIFIC_DATALAKE_BUCKET"
  S3_PREFIX: "raw-sensor-data/"
  LOG_LEVEL: "INFO"
  REDIS_URL: "redis://redis.traific-redis:6379/0"
  DEAD_LETTER_QUEUE_URL: "redis://redis.traific-redis:6379/1"
