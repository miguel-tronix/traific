apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-processor
  namespace: traific-apps
  labels:
    app: stream-processor
    app.kubernetes.io/name: stream-processor
    app.kubernetes.io/version: "1.0"
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: stream-processor
      app.kubernetes.io/name: stream-processor
  template:
    metadata:
      labels:
        app: stream-processor
        app.kubernetes.io/name: stream-processor
        app.kubernetes.io/version: "1.0"
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: stream-processor
      containers:
        - name: stream-processor
          image: traific/stream-processor:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: stream-processor-config
            - secretRef:
                name: stream-processor-secret
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stream-processor-secret
                  key: db-password
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: stream-processor
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: stream-processor
  namespace: traific-apps
  labels:
    app: stream-processor
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
  selector:
    app: stream-processor
    app.kubernetes.io/name: stream-processor
---
apiVersion: v1
kind: Secret
metadata:
  name: stream-processor-secret
  namespace: traific-apps
type: Opaque
stringData:
  db-password: "CHANGE_ME_IN_PRODUCTION"
