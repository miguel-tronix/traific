---
- name: Configure Traific Base Servers
  hosts: traific_servers
  become: true
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install common dependencies
      apt:
        name:
          - curl
          - git
          - jq
          - unzip
          - python3-pip
          - postgresql-client
          - gdal-bin
          - python3-gdal
        state: present

    - name: Install Python dependencies for GCP tools
      pip:
        name:
          - google-cloud-secretmanager
          - kubernetes
        state: present
        executable: pip3

- name: Configure Geospatial Tools
  hosts: traific_servers
  become: true
  tasks:
    - name: Install GDAL and geospatial libraries
      apt:
        name:
          - gdal-bin
          - python3-gdal
          - libproj-dev
          - libgeos-dev
        state: present

- name: Manage Traific Secrets in GCP Secret Manager
  hosts: traific_servers
  vars:
    gcp_project: "{{ lookup('env', 'GCP_PROJECT') }}"
  tasks:
    - name: Create GCP Secret Manager DB credentials
      command:
        cmd: >
          gcloud secrets create traific-db-credentials
          --replication-policy=automatic
          --project={{ gcp_project }}
      register: secret_result
      failed_when: "'AlreadyExistsException' not in secret_result.stderr and secret_result.rc != 0"
      changed_when: "'created' in secret_result.stdout"

    - name: Set DB credentials secret
      command:
        cmd: >
          echo '{"password":"CHANGE_ME_IN_PRODUCTION"}'
          | gcloud secrets versions add traific-db-credentials --data-file=-
          --project={{ gcp_project }}
      when: gcp_project is defined
      ignore_errors: yes

    - name: Create GCP Secret Manager Redis credentials
      command:
        cmd: >
          gcloud secrets create traific-redis-credentials
          --replication-policy=automatic
          --project={{ gcp_project }}
      register: redis_secret_result
      failed_when: "'AlreadyExistsException' not in redis_secret_result.stderr and redis_secret_result.rc != 0"
      changed_when: "'created' in redis_secret_result.stdout"

    - name: Set Redis credentials secret
      command:
        cmd: >
          echo '{"password":"CHANGE_ME_IN_PRODUCTION"}'
          | gcloud secrets versions add traific-redis-credentials --data-file=-
          --project={{ gcp_project }}
      when: gcp_project is defined
      ignore_errors: yes
