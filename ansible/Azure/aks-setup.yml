---
- name: Install AKS Prerequisites
  hosts: traific_servers
  become: true
  vars:
    azure_resource_group: traific-rg
    azure_location: australiaeast
    aks_cluster_name: traific-cluster
  tasks:
    - name: Install system dependencies
      apt:
        update_cache: yes
        cache_valid_time: 3600
        name:
          - curl
          - git
          - jq
          - unzip
          - python3-pip
          - python3-venv
          - apt-transport-https
          - gnupg2
          - ca-certificates
          - lsb-release
          - apt-transport-https
        state: present

    - name: Install Azure CLI
      shell: |
        curl -sL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor -o /usr/share/keyrings/microsoft.gpg
        echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/azure-cli/ $(lsb_release -cs) main" | tee /etc/apt/sources.list.d/azure-cli.list
        apt-get update
        apt-get install -y azure-cli
      args:
        creates: /usr/bin/az

    - name: Install kubectl
      get_url:
        url: "https://dl.k8s.io/release/v1.29.0/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: '0755'

    - name: Install Helm
      unarchive:
        src: https://get.helm.sh/helm-v3.14.0-linux-amd64.tar.gz
        dest: /usr/local
        remote_src: yes
        creates: /usr/local/bin/helm
      notify: Cleanup Helm archive

    - name: Login to Azure
      command:
        cmd: "az login --service-principal -u {{ azure_client_id }} -p {{ azure_client_secret }} --tenant {{ azure_tenant_id }}"
      when: azure_client_id is defined

    - name: Set Azure subscription
      command:
        cmd: "az account set --subscription {{ azure_subscription_id }}"
      when: azure_subscription_id is defined

    - name: Get AKS credentials
      command:
        cmd: >
          az aks get-credentials
          --resource-group {{ azure_resource_group }}
          --name {{ aks_cluster_name }}
          --overwrite-existing
      register: kubeconfig_result
      changed_when: true

  handlers:
    - name: Cleanup Helm archive
      file:
        path: /tmp/linux-amd64
        state: absent

- name: Install Kubernetes Add-ons (Helm)
  hosts: traific_servers
  vars:
    azure_resource_group: traific-rg
  tasks:
    - name: Add Helm repositories
      command:
        cmd: "/usr/local/bin/helm repo add {{ item.name }} {{ item.url }}"
        creates: "/var/lib/helm/repositories/{{ item.name }}"
      loop:
        - { name: 'metrics-server', url: 'https://kubernetes-sigs.github.io/metrics-server' }
        - { name: 'prometheus-community', url: 'https://prometheus-community.github.io/helm-charts' }
        - { name: 'grafana', url: 'https://grafana.github.io/helm-charts' }
        - { name: 'emqx', url: 'https://repos.emqx.io/charts' }

    - name: Update Helm repositories
      command:
        cmd: /usr/local/bin/helm repo update

    - name: Install Metrics Server
      command:
        cmd: >
          /usr/local/bin/helm upgrade --install metrics-server metrics-server/metrics-server
          --namespace kube-system
          --set args[0]="--kubelet-insecure-tls=true"
          --wait --timeout 2m

    - name: Install Azure Disk CSI Driver
      command:
        cmd: >
          /usr/local/bin/helm upgrade --install azuredisk-csi-driver
          https://raw.githubusercontent.com/kubernetes-sigs/azuredisk-csi-driver/master/charts/latest/azuredisk-csi-driver-*.tgz
          --namespace kube-system
          --set controller.replicaCount=2
          --wait --timeout 5m

    - name: Install ingress-nginx
      command:
        cmd: >
          /usr/local/bin/helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx
          --namespace ingress-nginx
          --create-namespace
          --set controller.service.type=LoadBalancer
          --set controller.publishService.enabled=true
          --wait --timeout 5m
